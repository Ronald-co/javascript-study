<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Document</title>
</head>
<body>
  

  <script >

  const xhr = new XMLHttpRequest();

  xhr.addEventListener('load', () => {
    console.log(xhr.response);
  })
  xhr.open('GET','https://supersimplebackend.dev/greeting');
  xhr.send();


  function loadGreeting (){
    fetch('https://supersimplebackend.dev/greeting').then((response) => {
      return response.text();
    }).then((text) => {
      console.log(text);
    })
  }


  async function loadGreeting (){
     await fetch('https://supersimplebackend.dev/greeting').then((response) => {
      return response.text();
    }).then((text) => {
      console.log(text);
    })
  }


  async function sendGreeting () {
    const response = await fetch ('https://supersimplebackend.dev/greeting', {
      method: 'POST', 
      headers: {
        'Content-Type': 'application/json'
      },
      body:JSON.stringify({
        name: 'Ronald'
      })
    });

    return await response.text();
  }
  sendGreeting();


  async function accessAmazon () {
    try {
      await fetch ('https://amazon.com')
    }
    catch (error) {
      console.log('CORS error. Your request was blocked by the backend.');
      console.log(error);
    }
  }
  accessAmazon();


  async function sendGreetingError () {
    try {
      const response = await fetch ('https://supersimplebackend.dev/greeting', {
        method: 'POST', 
        headers: {
          'Content-Type': 'application/json'
        }
      })

      if(response.status >= 400) {
        await errorTracker(response);
        return;
      }

      const text = await response.text();
      console.log(text);
    }
    catch (error) {
      console.log(error);
    }
  }
  sendGreetingError();


  async function errorTracker (error) {
    if (error.status === 400) {
      const response = await error.json();
      console.log(response);
    } 
  }
  


  </script>
</body>
</html>
