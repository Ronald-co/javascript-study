    function addOne(array) {
      const added = [];

      }

    function addArrays(array, array2) {
      const added = [];
      
      if (array.length > array2.length) {

    function countPositive(array) {
      const positive = [];

      for (let i = 0; i < array.length; i++) {

        }
      }
      console.log(positive.length);

    function minMax(array) {
      let min = array[0];
      let max = array[0];

      if (array.length === 0) {
        min = null, max = null;
      } else {
         for (let i = 0; i < array.length; i++) {
        if (array[i] < min) {
          min = array[i]
        } else if (array[i] > max){
          max = array[i]
        }
       }
      } 
      let result = {min: `${min}`, max: `${max}`};
      console.log(result);
    }

    function countWords(array) {
      const result = {};

      for (let i = 0; i < array.length; i++) {
       let word = array[i];

       if (!result[word]) {
        result[word] = 1;
       } else {
        result[word]++;
       }  
      }
      console.log(result);
    }

    function findIndex(array, word) {
      let index = -1;

     for (let i = 0; i < array.length; i++) {
      if (array[i] === word) {
        index = i;
        break;
     }}
     return index;
    }

    function unique(array) {
      const newArray = [];
      for (let i = 0; i < array.length; i++) {
        let element = array[i];

        if (findIndex(newArray, element) === -1) {
          newArray.push(element);
        }         
      }
      return newArray;
    }

    function removeEgg(foods) {
      const newFood = [];
      let eggRemoved = 0;
      const reversed = foods.slice().reverse();

      for (let i = 0; i < reversed.length; i++) {
       if (reversed[i] === 'egg' && eggRemoved < 2) {
        eggRemoved++;
        continue;
       }
       newFood.push(reversed[i]);
      }
      newFood.reverse();
      return newFood;
    }
