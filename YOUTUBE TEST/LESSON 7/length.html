  <title>Temperature Regulation</title>

<body>
  


  <script>

    function convertLength(length, from, to) {
 
    if (to != 'miles' && to != 'km' && to != 'ft') {
      console.log(`Invalid unit: ${to}`);
    } else {
      if (from === 'miles' && to === 'km') {
        console.log((length * 1.6) + to);
      } else if (from === 'km' && to ==='miles') {
        console.log((length / 1.6) + to);
      }else if (from === 'km' && to ==='ft') {
        console.log((length * 3281) + to);
      }else if (from === 'ft' && to ==='km') {
        console.log((length / 3281) + to);
      }else if (from === 'miles' && to ==='ft') {
        console.log((length * 5280) + to);
      }else if (from === 'ft' && to ==='miles') {
        console.log((length / 5280) + to);
      }else {
        console.log(length + from);
      }
    }
    }  
      


    convertLength(50, 'miles', 'km');
    convertLength(32, 'km', 'miles');
    convertLength(5, 'km', 'km');
    convertLength(5, 'miles', 'ft');
    convertLength(5, 'km', 'ft');
    convertLength(5, 'ft', 'ft');
    convertLength(5, 'ft', 'lbs');


  </script>
</body>
