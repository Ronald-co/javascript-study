<!DOCTYPE html>
<head>
  <title>shipping calculator</title>


  <style>

    .calculation-button{
      font-family: Arial;
      color: white;
      border: none;
      background-color: green;
      font-size: 10px;
      padding: 8px 10px;
    }

    .input-button{
      font-size: 10px;
      padding: 6px 10px;
    }
    .error{
      font-size: 10px;
      font-family: Arial;
      color: red;
    }

  </style>

</head>
<body>
  <p>Amazon Shipping Calculator</p>


  <input class="js-input input-button" placeholder="Cost of goods" onkeydown="
   enterShippingCost(event);
  ">

  <button onclick=" shippingCost();
  " class="js-calculate calculation-button">Calculate</button>

  <p class="js-result"></p>

  <script>
    
   function shippingCost() {
      
    let cost = Number(document.querySelector('.js-input').value);
    const result = document.querySelector('.js-result');

    if (cost < 0) {
      result.classList.add('error');
      document.querySelector('.error').innerHTML= 'Error: cost cannot be less than $0'
    
    } else {
      (cost < 40) ? cost = cost + 10 : cost = cost;
    
      let final = cost.toFixed(2);
      result.classList.remove('error');
      result.innerHTML= `$${final}`;
    }
   }

   function enterShippingCost (event){
     (event.key === 'Enter') ? shippingCost() : null ;
   }
  
  </script>
</body>
</html>
