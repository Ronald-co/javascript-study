    let messages = 0;

    function messageCount() {
       
       const addElem = document.querySelector('.js-add-button');
       const removeElem = document.querySelector('.js-remove-button');

       addElem.addEventListener('click', () => {
         messages++;
       })
        removeElem.addEventListener('click', () => {
         (messages === 0)? messages=0 :messages--;
       })
    }
    
    function changeTitle(){

     if (messages === 0) {
      document.title = 'App'
     } else {
        (document.title === 'App') ? document.title= `(${messages}) New messages` : document.title = 'App';
    }
    }
    messageCount();
    setInterval(changeTitle, 1000);
