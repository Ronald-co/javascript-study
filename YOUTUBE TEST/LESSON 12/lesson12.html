<!DOCTYPE html>
<head>
  <title>11.html</title>

  <style>

  </style>
</head>
<body>

   <button class="js-button" onclick="change()">Done</button>
 
  <script>
    
    const add = () => {
      console.log(2+3);
    }

    function runTwice(fun) {
      fun();
      fun();
    }

    runTwice(add);
    runTwice(function () {console.log('12b');});


    function change() {
      setTimeout(() => {
        document.querySelector('.js-button').innerHTML= 'Finished!'
      }, 1000)
    }

    

  </script>
</body>
</html>
