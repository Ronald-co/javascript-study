<!DOCTYPE html>
<head>
  <title>rock paper scissors</title>
  <link rel="stylesheet" href="rock-paper-scissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>

  <button
   onclick=" 
   gameMove('Rock');
   " 
   class="moveButton"
  >
   <img src="../IMAGES/rock-emoji.png" class="moveIcon">
 </button>

  <button
   onclick=" 
   gameMove('Paper');
   "
   class="moveButton">
   <img src="../IMAGES/paper-emoji.png" class="moveIcon">
  </button>

  <button 
   onclick=" 
   gameMove('Scissors');
   "
   class="moveButton">
   <img src="../IMAGES/scissors-emoji.png" class="moveIcon">
  </button>


  <p class="js-result"></p>

  <p class="moveParagraph js-move"></p>

  <p class="js-score scoreParagraph"></p>

  <button
   class="resetButton js-reset-button"
  >Reset score</button>

  <button class="js-autoplay-button  autoplayButton">Auto Play</button>

  <p class="js-reset-paragraph"></p>

   <script src="rock-paper-scissors.js"></script>
</body>
</html>
